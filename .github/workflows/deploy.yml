
name: Deploy DFS Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'

# Prevent overlapping deploys
concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:

  # ============================================================
  # CI — Build and Push Docker Image
  # ============================================================
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/dfs-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/dfs-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ============================================================
  # CD — Deploy to EC2
  # ============================================================
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            set -e

            # ==================================================
            # Identify the exact image built by this commit
            # ==================================================

            IMAGE="${{ secrets.DOCKER_USERNAME }}/dfs-backend:${{ github.sha }}"

            echo "Deploying image: $IMAGE"


            # ==================================================
            # Pull exact image
            # ==================================================

            docker pull "$IMAGE"


            # ==================================================
            # Run database migrations BEFORE stopping backend
            # ==================================================

            echo "Running database migrations..."

            docker run --rm \
              --env-file /home/ubuntu/.env \
              "$IMAGE" \
              npx prisma migrate deploy

            echo "Database migrations successful."


            # ==================================================
            # Stop old container
            # ==================================================

            echo "Stopping old backend..."

            docker stop dfs-backend || true
            docker rm dfs-backend || true


            # ==================================================
            # Start new backend
            # ==================================================

            echo "Starting new backend..."

            docker run -d \
              -p 5000:5000 \
              --env-file /home/ubuntu/.env \
              --name dfs-backend \
              --restart always \
              "$IMAGE"


            # ==================================================
            # Verify container started
            # ==================================================

            echo "Waiting for container..."

            sleep 5

            if ! docker ps --format '{{.Names}}' | grep -q '^dfs-backend$'; then
              echo "Container failed to start!"
              docker logs dfs-backend || true
              exit 1
            fi

            echo "Backend container is running."


            # ==================================================
            # Cleanup unused Docker images
            # ==================================================

            docker image prune -f

            echo "Deployment successful!"

